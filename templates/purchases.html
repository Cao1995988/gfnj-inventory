{% extends "base.html" %}
{% block title %}入库登记{% endblock %}
{% block content %}
<div class="page-head">
  <h2>入库登记</h2>
  <button class="btn primary" onclick="openNew()">+ 新建入库单</button>
</div>
<div class="table-wrap"><table class="data-table" id="tbl">
  <thead><tr><th>单号</th><th>供应商</th><th>金额</th><th>操作人</th><th>日期</th><th>备注</th><th>操作</th></tr></thead>
  <tbody></tbody>
</table></div>

<dialog id="dlg" class="modal large">
  <form method="dialog" onsubmit="save(event)">
    <h3>新建入库单</h3>
    <div class="form-row">
      <label>供应商<select id="f-supplier" required></select></label>
      <label>入库日期<input id="f-date" type="date"></label>
    </div>
    <label>备注<input id="f-notes"></label>
    <h4>明细 <button type="button" class="btn small" onclick="addItem()">+ 添加行</button></h4>
    <div class="table-wrap"><table class="data-table" id="items">
      <thead><tr><th>商品</th><th>数量</th><th>单价</th><th>小计</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="total-row">合计: <span id="total">0.00</span></div>
    <div class="dlg-actions">
      <button type="button" onclick="document.getElementById('dlg').close()">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let purchaseItems = [];
let allProducts = [];
let allSuppliers = [];

async function loadData(){
  const [dp, ds] = await Promise.all([api('/api/products'), api('/api/suppliers')]);
  if(dp) allProducts = dp.data;
  if(ds) allSuppliers = ds.data;
}

function loadList(){
  api('/api/purchases').then(d=>{
    if(!d) return;
    $('#tbl tbody').innerHTML = d.data.map(p=>`<tr>
      <td>${p.order_no}</td>
      <td>${p.supplier_name||''}</td>
      <td>¥${fmt(p.total)}</td>
      <td>${p.operator}</td>
      <td>${p.created_at?p.created_at.substring(0,10):''}</td>
      <td>${p.notes||''}</td>
      <td><button class="btn small" onclick="viewDetail(${p.id})">详情</button>
        <button class="btn small danger" onclick="del(${p.id})">删</button></td>
    </tr>`).join('') || '<tr><td colspan="7">无数据</td></tr>';
  });
}

async function openNew(){
  await loadData();
  purchaseItems = [];
  $('#f-supplier').innerHTML = allSuppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  $('#f-date').value = new Date().toISOString().substring(0,10);
  $('#f-notes').value = '';
  renderItems();
  calcTotal();
  $('#dlg').showModal();
}

function renderItems(){
  $('#items tbody').innerHTML = purchaseItems.map((it,i)=>`<tr>
    <td>
      <select onchange="onProductChange(${i},this.value)" style="width:100%">
        <option value="">选择商品</option>
        ${allProducts.map(p=>`<option value="${p.id}" ${p.id==it.product_id?'selected':''}>${p.code} ${p.name}</option>`).join('')}
      </select>
    </td>
    <td><input type="number" step="0.01" value="${it.quantity||1}" style="width:80px" oninput="onQtyChange(${i},this.value)"></td>
    <td><input type="number" step="0.01" value="${it.price||0}" style="width:90px" oninput="onPriceChange(${i},this.value)"></td>
    <td>¥${fmt((it.quantity||0)*(it.price||0))}</td>
    <td><button type="button" class="btn small danger" onclick="removeItem(${i})">删</button></td>
  </tr>`).join('') || '<tr><td colspan="5">请添加商品</td></tr>';
}

function addItem(){
  purchaseItems.push({product_id:'',product_name:'',quantity:1,price:0});
  renderItems();
}

function removeItem(i){
  purchaseItems.splice(i,1);
  renderItems();
  calcTotal();
}

function onProductChange(i, pid){
  const p = allProducts.find(x=>x.id==+pid);
  if(p){
    purchaseItems[i].product_id = p.id;
    purchaseItems[i].product_name = p.name;
    purchaseItems[i].price = p.purchase_price;
    renderItems();
  }
  calcTotal();
}

function onQtyChange(i, v){
  purchaseItems[i].quantity = +v||0;
  renderItems();
  calcTotal();
}

function onPriceChange(i, v){
  purchaseItems[i].price = +v||0;
  renderItems();
  calcTotal();
}

function calcTotal(){
  const total = purchaseItems.reduce((s,it)=>s+(it.quantity||0)*(it.price||0), 0);
  $('#total').textContent = total.toFixed(2);
}

async function save(e){
  e.preventDefault();
  const valid = purchaseItems.filter(it=>it.product_id);
  if(!valid.length){ alert('请至少添加一个商品'); return; }
  const sid = $('#f-supplier').value;
  const supplier = allSuppliers.find(s=>s.id==+sid);
  const body = {
    supplier_id: +sid || null,
    supplier_name: supplier ? supplier.name : '',
    notes: $('#f-notes').value,
    items: valid.map(it=>({
      product_id: it.product_id,
      product_name: it.product_name,
      quantity: it.quantity,
      price: it.price
    }))
  };
  const d = await api('/api/purchases', {method:'POST', body:JSON.stringify(body)});
  if(!d) return;
  $('#dlg').close();
  loadList();
}

async function viewDetail(id){
  const d = await api(`/api/purchases/${id}`);
  if(!d) return;
  const p = d.data;
  let html = `<h3>入库单 ${p.order_no}</h3>
    <p>供应商: ${p.supplier_name||''} | 操作人: ${p.operator} | ${p.created_at}</p>
    <p>备注: ${p.notes||''}</p>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>商品</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>`;
  (p.items||[]).forEach(i=>{
    html += `<tr><td>${i.product_name}</td><td>${i.quantity}</td><td>¥${fmt(i.price)}</td><td>¥${fmt(i.subtotal)}</td></tr>`;
  });
  html += `<tr><td colspan="3" style="text-align:right;font-weight:bold">合计</td><td style="font-weight:bold">¥${fmt(p.total)}</td></tr>`;
  html += '</tbody></table></div><div class="dlg-actions"><button class="primary" onclick="document.getElementById(\'dlg\').close()">关闭</button></div>';
  const detailDlg = document.createElement('dialog');
  detailDlg.className = 'modal large';
  detailDlg.innerHTML = html;
  document.body.appendChild(detailDlg);
  detailDlg.showModal();
  detailDlg.addEventListener('close', ()=>detailDlg.remove());
}

async function del(id){
  if(!confirm('确认删除该入库单？库存将恢复。')) return;
  await api(`/api/purchases/${id}`, {method:'DELETE'});
  loadList();
}

loadList();
</script>
{% endblock %}
