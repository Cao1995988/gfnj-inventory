{% extends "base.html" %}
{% block title %}商品管理{% endblock %}
{% block content %}
<div class="page-head">
  <h2>商品管理</h2>
  <div class="head-actions">
    <input id="q" placeholder="搜编码/名称/类别" oninput="loadList()">
    <label class="check"><input type="checkbox" id="low" onchange="loadList()"> 仅看低库存</label>
    <button class="btn primary" onclick="openEdit()">+ 新增商品</button>
  </div>
</div>
<div class="table-wrap"><table class="data-table" id="tbl">
  <thead><tr><th>编码</th><th>名称</th><th>类别</th><th>规格</th><th>单位</th><th>进价</th><th>售价</th><th>库存</th><th>安全库存</th><th>供应商</th><th>条码</th><th>操作</th></tr></thead>
  <tbody></tbody>
</table></div>

<dialog id="dlg" class="modal">
  <form method="dialog" onsubmit="save(event)">
    <h3 id="dlg-title">新增商品</h3>
    <input type="hidden" id="f-id">
    <label>编码<input id="f-code" required></label>
    <label>名称<input id="f-name" required></label>
    <label>类别<input id="f-category"></label>
    <label>规格<input id="f-spec"></label>
    <label>单位<input id="f-unit" value="个"></label>
    <label>进价<input id="f-purchase" type="number" step="0.01" value="0"></label>
    <label>售价<input id="f-sale" type="number" step="0.01" value="0"></label>
    <label>库存<input id="f-stock" type="number" step="0.01" value="0"></label>
    <label>安全库存<input id="f-safety" type="number" step="0.01" value="0"></label>
    <label>供应商<select id="f-supplier"><option value="">无</option></select></label>
    <label>绑定条码
      <div style="display:flex;gap:6px;align-items:center">
        <input id="f-barcodes" placeholder="多个条码用逗号分隔" style="flex:1">
        <button type="button" class="btn small" onclick="scanBarcode()">📷扫一扫</button>
      </div>
      <small style="color:#888;display:block;margin-top:2px">扫厂家自带的条形码/二维码绑定到此商品，之后扫码即可自动识别</small>
    </label>
    <div class="dlg-actions">
      <button type="button" onclick="document.getElementById('dlg').close()">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="bc-dlg" class="modal">
  <h3>扫描条码</h3>
  <p style="color:#888;font-size:13px">将商品的条形码/二维码对准摄像头</p>
  <div id="bc-scan-area" style="display:none">
    <video id="bc-video" style="width:100%;border-radius:8px"></video>
  </div>
  <div class="dlg-actions">
    <button type="button" onclick="closeBcScan()">取消</button>
  </div>
</dialog>
{% endblock %}

{% block scripts %}
<script src="/static/js/jsQR.min.js"></script>
<script>
let bcStream = null;

async function loadSuppliers(){
  const d = await api('/api/suppliers');
  if(!d) return;
  const sel = $('#f-supplier');
  sel.innerHTML = '<option value="">无</option>' + d.data.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

async function loadList(){
  const q = $('#q').value;
  const low = $('#low').checked ? '1' : '';
  const d = await api('/api/products?q='+encodeURIComponent(q)+'&low='+low);
  if(!d) return;
  $('#tbl tbody').innerHTML = d.data.map(p=>`<tr>
    <td>${p.code}</td>
    <td>${p.name}</td>
    <td>${p.category||''}</td>
    <td>${p.spec||''}</td>
    <td>${p.unit||''}</td>
    <td>${fmt(p.purchase_price)}</td>
    <td>${fmt(p.sale_price)}</td>
    <td>${p.stock}</td>
    <td>${p.safety_stock}</td>
    <td>${p.supplier_name||''}</td>
    <td>${p.barcodes||''}</td>
    <td><button class="btn small" onclick="openEdit(${p.id})">改</button>
      <button class="btn small danger" onclick="del(${p.id})">删</button></td>
  </tr>`).join('') || '<tr><td colspan="12">无数据</td></tr>';
}

async function openEdit(id){
  await loadSuppliers();
  const dlg = $('#dlg');
  $('#dlg-title').textContent = id ? '编辑商品' : '新增商品';
  $('#f-id').value = '';
  $('#f-code').value = '';
  $('#f-name').value = '';
  $('#f-category').value = '';
  $('#f-spec').value = '';
  $('#f-unit').value = '个';
  $('#f-purchase').value = 0;
  $('#f-sale').value = 0;
  $('#f-stock').value = 0;
  $('#f-safety').value = 0;
  $('#f-supplier').value = '';
  $('#f-barcodes').value = '';
  if(id){
    const d = await api('/api/products?q=');
    if(!d) return;
    const p = d.data.find(x=>x.id===id);
    if(!p) return;
    $('#f-id').value = p.id;
    $('#f-code').value = p.code;
    $('#f-name').value = p.name;
    $('#f-category').value = p.category||'';
    $('#f-spec').value = p.spec||'';
    $('#f-unit').value = p.unit||'个';
    $('#f-purchase').value = p.purchase_price;
    $('#f-sale').value = p.sale_price;
    $('#f-stock').value = p.stock;
    $('#f-safety').value = p.safety_stock;
    $('#f-supplier').value = p.supplier_id||'';
    $('#f-barcodes').value = p.barcodes||'';
  }
  dlg.showModal();
}

async function save(e){
  e.preventDefault();
  const id = $('#f-id').value;
  const body = {
    code: $('#f-code').value.trim(),
    name: $('#f-name').value.trim(),
    category: $('#f-category').value.trim(),
    spec: $('#f-spec').value.trim(),
    unit: $('#f-unit').value.trim()||'个',
    purchase_price: +$('#f-purchase').value||0,
    sale_price: +$('#f-sale').value||0,
    stock: +$('#f-stock').value||0,
    safety_stock: +$('#f-safety').value||0,
    supplier_id: $('#f-supplier').value||null,
    barcodes: $('#f-barcodes').value.trim(),
  };
  if(id) body.supplier_id = body.supplier_id ? +body.supplier_id : null;
  const d = await api(id?`/api/products/${id}`:'/api/products', {method:id?'PUT':'POST', body:JSON.stringify(body)});
  if(!d) return;
  $('#dlg').close();
  loadList();
}

async function del(id){
  if(!confirm('确认删除该商品？')) return;
  await api(`/api/products/${id}`, {method:'DELETE'});
  loadList();
}

async function scanBarcode(){
  const dlg = $('#bc-dlg');
  dlg.showModal();
  const area = $('#bc-scan-area');
  const video = $('#bc-video');
  area.style.display = 'none';

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('当前浏览器不支持摄像头');
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    bcStream = stream;
    video.srcObject = stream;
    video.setAttribute('playsinline', true);
    video.setAttribute('autoplay', true);
    await video.play();
    area.style.display = 'block';
    // Scan loop
    const canvas = document.createElement('canvas');
    async function loop(){
      if(!bcStream) return;
      if(video.readyState >= 2 && video.videoWidth > 0){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if(window.jsQR){
          const qr = jsQR(imgData.data, canvas.width, canvas.height, {inversionAttempts:'attemptBoth'});
          if(qr){
            const code = qr.data;
            // Append barcode
            const cur = $('#f-barcodes').value.trim();
            $('#f-barcodes').value = cur ? cur + ',' + code : code;
            closeBcScan();
            return;
          }
        }
      }
      requestAnimationFrame(loop);
    }
    loop();
  }catch(err){
    alert('无法打开摄像头: ' + err.message);
    dlg.close();
  }
}

function closeBcScan(){
  if(bcStream){ bcStream.getTracks().forEach(t=>t.stop()); bcStream=null; }
  $('#bc-dlg').close();
}

loadList();
</script>
{% endblock %}
