services:
  - type: web
    name: gfnj-inventory
    runtime: python
    repo: https://github.com/Cao1995988/gfnj-inventory
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
